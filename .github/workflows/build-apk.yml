name: Build Miy Sklad APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -oq miy_sklad_android_stage22_source.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check JavaScript
        working-directory: project
        run: python3 scripts/check_html_js.py
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: miy-sklad-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
